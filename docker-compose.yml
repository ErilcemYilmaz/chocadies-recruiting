# Lokaler Betrieb beider Container (Kapitel 4.4.1), siehe docs/deployment.md.
#
#   docker compose --env-file web/.env.local up --build
#
# Zugangsdaten stehen nur in lokalen, per .gitignore ausgeschlossenen Dateien:
# - server/.env         MONGODB_URI, JWT_SECRET (Laufzeit der Server-App)
# - web/.env.local      Demo-Anmeldung der SPA (Build-Argumente, optional)
# Ohne --env-file startet alles ebenfalls, die Anmeldung der SPA ist dann
# aber gesperrt (leere Demo-Werte).

services:
  server:
    build: ./server
    image: chocadies-recruiting-server:lokal
    env_file: ./server/.env
    environment:
      NODE_ENV: production
      PORT: "3000"
    # Nur fuer Diagnose von aussen erreichbar (3001, damit "npm run dev" auf
    # 3000 parallel laufen kann); die SPA spricht intern ueber "server:3000".
    ports:
      - "3001:3000"
    restart: unless-stopped

  web:
    build:
      context: ./web
      args:
        VITE_DEMO_EMAIL: ${VITE_DEMO_EMAIL:-}
        VITE_DEMO_PASSWORT: ${VITE_DEMO_PASSWORT:-}
        VITE_DEMO_NAME: ${VITE_DEMO_NAME:-}
        VITE_DEMO_ROLLE: ${VITE_DEMO_ROLLE:-}
        VITE_API_TOKEN: ${VITE_API_TOKEN:-}
    image: chocadies-recruiting-web:lokal
    environment:
      API_UPSTREAM: http://server:3000
    ports:
      - "8080:80"
    # nginx loest "server" beim Start auf, deshalb erst starten, wenn die
    # Server-App ihren Healthcheck bestanden hat.
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped
